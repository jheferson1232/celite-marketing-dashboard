# Informe Meta → Telegram 2×/día: 8:00 y 20:00 America/Lima
# (13:00 UTC = 8:00 Lima; 01:00 UTC = 20:00 Lima).
# Requiere secrets: CRON_SECRET (mismo valor que en Vercel).
# Opcional: META_CRON_APP_URL (default: producción en Vercel).

name: Meta Telegram daily

on:
  schedule:
    - cron: "0 13 * * *" # 8:00 America/Lima
    - cron: "0 1 * * *" # 20:00 America/Lima
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar cron Meta en producción
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.META_CRON_APP_URL }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Falta el secret CRON_SECRET en GitHub (Settings → Secrets → Actions)"
            exit 1
          fi
          CRON_SECRET="$(printf '%s' "$CRON_SECRET" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          BASE="${APP_URL:-https://celite-marketing-dashboard-chi.vercel.app}"
          BASE="${BASE%/}"
          URL="${BASE}/api/cron/meta-telegram-reports"
          echo "GET ${URL}"
          HTTP_CODE=$(curl -sS --retry 2 --retry-delay 5 --max-time 120 \
            -o /tmp/meta-cron-response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${URL}")
          echo "HTTP ${HTTP_CODE}"
          cat /tmp/meta-cron-response.json || true
          if [ "$HTTP_CODE" = "401" ]; then
            echo "::error::401 Unauthorized — CRON_SECRET de GitHub no coincide con Vercel (o falta en Vercel). Copia el mismo valor en ambos y redeploy."
            exit 1
          fi
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::El cron respondió HTTP ${HTTP_CODE}"
            exit 1
          fi
